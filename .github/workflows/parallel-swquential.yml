name: Parallel then Sequential

on: [push]

jobs:
  # These three run in parallel
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Linting code"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running unit tests"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Scanning for vulnerabilities"

  # This waits for all three above
  integration-tests:
    needs: [lint, unit-tests, security-scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running integration tests"

  # This waits for integration tests
  deploy:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying application"